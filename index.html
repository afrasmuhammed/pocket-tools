<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f5f2eb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e0e0d" media="(prefers-color-scheme: dark)">
  <meta name="description" content="PocketKit — private everyday tools, installed like an app.">
  <meta name="robots" content="index, follow">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://pocketkit.app/">
  <meta property="og:title" content="PocketKit">
  <meta property="og:description" content="Private everyday tools, installed like an app.">
  <meta property="og:image" content="https://pocketkit.app/assets/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="PocketKit">
  <meta name="twitter:description" content="Private everyday tools, installed like an app.">
  <meta name="twitter:image" content="https://pocketkit.app/assets/og-image.png">
  <title>PocketKit</title>
  <link rel="manifest" href="manifest.json">
  <link rel="search" type="application/opensearchdescription+xml" title="PocketKit" href="opensearch.xml">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%2322221f'/><text x='50' y='68' text-anchor='middle' font-family='Inter,system-ui,sans-serif' font-size='42' font-weight='800' fill='white'>PK</text></svg>">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Instrument+Sans:ital,wght@0,500;0,600;0,700;1,500;1,600&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="css/styles.css?v=29">
  <script>
    (function() {
      var t = localStorage.getItem('pt-theme');
      if (t === 'dark' || t === 'light') {
        document.documentElement.setAttribute('data-theme', t);
      }
    })();
  </script>
</head>
<body>

  <header class="app-header">
    <button id="btn-back" class="btn-icon hidden" aria-label="Back to home">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <button id="btn-quick-open" class="btn-icon quick-open-trigger" aria-label="Quick open">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    </button>
    <h1 id="app-title">
      <svg class="app-logo" viewBox="0 0 28 28" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
        <rect width="28" height="28" rx="7" style="fill: var(--accent)"/>
        <text x="14" y="19.5" text-anchor="middle" fill="white"
          font-family="Inter,-apple-system,BlinkMacSystemFont,sans-serif"
          font-size="11.5" font-weight="800">PK</text>
      </svg>
      <span>PocketKit</span>
    </h1>
    <button id="btn-theme" class="btn-icon" aria-label="Toggle theme">
      <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
  </header>

  <main>

    <!-- APP VIEW -->
    <section id="view-home" class="view"></section>

    <!-- TOOL VIEW -->
    <section id="view-tool" class="view hidden">
      <div id="tool-container" class="tool-container">
        <div class="skeleton" aria-hidden="true"></div>
      </div>
    </section>

  </main>

  <div id="toast-container" class="toast-container" aria-live="polite" aria-atomic="true"></div>
  <div id="command-palette" class="command-palette hidden" role="dialog" aria-modal="true" aria-label="Quick open">
    <div class="command-panel">
      <div class="command-input-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
        </svg>
        <input id="command-input" class="command-input" type="search" autocomplete="off" spellcheck="false" placeholder="Open a tool, pocket, or saved item">
        <kbd>Esc</kbd>
      </div>
      <div id="command-results" class="command-results" role="listbox"></div>
    </div>
  </div>

  <nav class="mobile-tabbar" aria-label="Primary navigation">
    <button data-mobile-route="#/" aria-label="Home">Home</button>
    <button data-mobile-route="#/pocket/daily" aria-label="Pockets">Pockets</button>
    <button data-mobile-route="#/all" aria-label="All tools">All</button>
  </nav>

  <script type="module" src="js/app.js?v=41"></script>
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "PocketKit",
      "applicationCategory": "UtilitiesApplication",
      "operatingSystem": "Any",
      "url": "https://pocketkit.app/",
      "description": "Private everyday browser tools, organized into installable pockets.",
      "offers": [
        { "@type": "Offer", "name": "PocketKit Daily", "price": "0", "priceCurrency": "USD" },
        { "@type": "Offer", "name": "PocketKit Pro launch preview", "price": "24", "priceCurrency": "USD" }
      ],
      "featureList": [
        "76 private browser tools",
        "Installable PWA",
        "Offline-first utility workflows",
        "PDF, image, text, SEO, QA, developer, time, and money tools"
      ]
    }
  </script>
</body>
</html>
