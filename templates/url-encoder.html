<div class="tool-header">
  <h2>URL Encoder / Decoder</h2>
  <p>Encode links, query strings, and URL components. Decode percent-encoded text back to readable form.</p>
</div>

<div class="tool-dashboard">
  <section class="tool-panel">
    <div class="input-group">
      <label for="url-input">Input</label>
      <textarea id="url-input" class="textarea-medium" placeholder="https://example.com/search?q=hello world" spellcheck="false"></textarea>
    </div>
    <div class="input-group">
      <label for="url-mode">Mode</label>
      <select id="url-mode">
        <option value="component">URL component</option>
        <option value="full">Full URL</option>
        <option value="form">Form/query value (+ for spaces)</option>
      </select>
    </div>
    <div class="button-row">
      <button id="btn-url-encode" class="btn">Encode</button>
      <button id="btn-url-decode" class="btn btn-secondary">Decode</button>
      <button id="btn-url-swap" class="btn btn-secondary">Swap</button>
      <button id="btn-url-clear" class="btn btn-secondary">Clear</button>
    </div>
  </section>

  <section class="tool-panel">
    <div class="input-group">
      <label for="url-output">Output</label>
      <textarea id="url-output" class="textarea-medium" readonly placeholder="Result will appear here..." spellcheck="false"></textarea>
    </div>
    <div class="metric-grid">
      <div class="metric">
        <span>Input Length</span>
        <strong id="url-input-length">0</strong>
      </div>
      <div class="metric">
        <span>Output Length</span>
        <strong id="url-output-length">0</strong>
      </div>
    </div>
    <button id="btn-url-copy" class="btn">Copy Output</button>
  </section>
</div>
