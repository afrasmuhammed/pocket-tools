<div class="tool-header">
  <h2>Color Palette Extractor</h2>
  <p>Extract the 6 dominant colours from any image. Click a swatch to copy its HEX value.</p>
</div>

<div class="tool-dashboard">
  <section class="tool-panel">
    <div class="drop-zone">
      <input type="file" id="cp2-upload" accept="image/*,.heic,.heif,image/heic,image/heif">
      <div>
        <strong>Select Image</strong>
        <span>JPG, PNG, WebP, GIF, HEIC — up to 10 MB</span>
      </div>
    </div>

    <div id="cp2-preview-wrap" class="cp2-preview-wrap hidden">
      <img id="cp2-preview" class="cp2-preview" alt="Image preview">
    </div>
  </section>

  <section class="tool-panel">
    <div id="cp2-empty" class="cp2-empty">
      <p>Upload an image to extract its colour palette.</p>
    </div>

    <div id="cp2-results" class="cp2-results hidden">
      <div id="cp2-swatches" class="cp2-swatches"></div>
      <div class="button-row">
        <button id="cp2-copy-all" class="btn">Copy all as CSS</button>
        <button id="cp2-clear"    class="btn btn-secondary">Clear</button>
      </div>
    </div>
  </section>
</div>
