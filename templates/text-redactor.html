<div class="tool-header">
  <h2>Text Redactor</h2>
  <p>Mask sensitive text patterns before sharing notes, logs, or QA reports.</p>
</div>

<div class="tool-dashboard">
  <section class="tool-panel">
    <div class="input-group">
      <label for="redact-input">Input Text</label>
      <textarea id="redact-input" class="textarea-tall" placeholder="Paste text containing emails, phones, IDs, or card-like numbers..." spellcheck="false"></textarea>
    </div>
    <div class="checkbox-grid">
      <label><input type="checkbox" id="redact-email" checked> Emails</label>
      <label><input type="checkbox" id="redact-phone" checked> Phone numbers</label>
      <label><input type="checkbox" id="redact-card" checked> Card-like numbers</label>
      <label><input type="checkbox" id="redact-ip"> IP addresses</label>
    </div>
    <div class="button-row">
      <button id="btn-redact-run" class="btn">Redact</button>
      <button id="btn-redact-sample" class="btn btn-secondary">Sample</button>
      <button id="btn-redact-clear" class="btn btn-secondary">Clear</button>
    </div>
  </section>

  <section class="tool-panel">
    <div class="input-group">
      <label for="redact-output">Redacted Text</label>
      <textarea id="redact-output" class="textarea-tall" readonly placeholder="Redacted text will appear here..." spellcheck="false"></textarea>
    </div>
    <div class="metric-grid">
      <div class="metric"><span>Replacements</span><strong id="redact-count">0</strong></div>
    </div>
    <button id="btn-redact-copy" class="btn">Copy Redacted Text</button>
  </section>
</div>
