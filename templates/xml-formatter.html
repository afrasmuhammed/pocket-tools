<div class="tool-header">
  <h2>XML Formatter / Minifier</h2>
  <p>Validate XML, make it readable, or compress it into one line.</p>
</div>

<div class="tool-dashboard">
  <section class="tool-panel">
    <div class="input-group">
      <label for="xml-input">Input XML</label>
      <textarea id="xml-input" class="textarea-tall" placeholder="Paste XML here..." spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off"></textarea>
    </div>

    <div class="button-row">
      <button id="btn-xml-format" class="btn">Format</button>
      <button id="btn-xml-minify" class="btn btn-secondary">Minify</button>
      <button id="btn-xml-sample" class="btn btn-secondary">Sample</button>
      <button id="btn-xml-clear" class="btn btn-secondary">Clear</button>
    </div>
  </section>

  <section class="tool-panel">
    <div class="input-group">
      <label for="xml-output">Output</label>
      <textarea id="xml-output" class="textarea-tall" readonly placeholder="Formatted XML will appear here..." spellcheck="false"></textarea>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <span>Elements</span>
        <strong id="xml-elements">0</strong>
      </div>
      <div class="stat-card">
        <span>Lines</span>
        <strong id="xml-lines">0</strong>
      </div>
      <div class="stat-card">
        <span>Size</span>
        <strong id="xml-size">0</strong>
      </div>
    </div>

    <button id="btn-xml-copy" class="btn">Copy Output</button>
  </section>
</div>
