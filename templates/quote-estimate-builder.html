<div class="tool-header">
  <h2>Quote / Estimate Builder</h2>
  <p>Create a polished project estimate with scope, line items, tax, deposit, and PDF export.</p>
</div>

<div class="tool-dashboard">
  <section class="tool-panel">
    <div class="settings-grid" style="grid-template-columns: 1fr 1fr;">
      <div class="input-group">
        <label for="quote-from">From</label>
        <textarea id="quote-from" class="textarea-short" placeholder="Your Studio&#10;hello@example.com&#10;City, Country"></textarea>
      </div>
      <div class="input-group">
        <label for="quote-client">Client</label>
        <textarea id="quote-client" class="textarea-short" placeholder="Client Name&#10;client@example.com&#10;Company"></textarea>
      </div>
    </div>
    <div class="settings-grid">
      <div class="input-group">
        <label for="quote-number">Estimate Number</label>
        <input type="text" id="quote-number" placeholder="EST-001">
      </div>
      <div class="input-group">
        <label for="quote-date">Estimate Date</label>
        <input type="date" id="quote-date">
      </div>
      <div class="input-group">
        <label for="quote-valid">Valid Until</label>
        <input type="date" id="quote-valid">
      </div>
      <div class="input-group">
        <label for="quote-currency">Currency</label>
        <select id="quote-currency">
          <option value="$" selected>USD $</option>
          <option value="EUR ">EUR</option>
          <option value="GBP ">GBP</option>
          <option value="INR ">INR</option>
          <option value="AED ">AED</option>
        </select>
      </div>
    </div>
    <div class="input-group">
      <label for="quote-project">Project / Scope Summary</label>
      <textarea id="quote-project" class="textarea-short" placeholder="Short project description, deliverables, or assumptions."></textarea>
    </div>
  </section>

  <section class="tool-panel">
    <div class="settings-grid">
      <div class="input-group">
        <label for="quote-item">Item</label>
        <input type="text" id="quote-item" placeholder="Landing page design">
      </div>
      <div class="input-group">
        <label for="quote-qty">Qty</label>
        <input type="number" id="quote-qty" min="0" step="0.01" value="1">
      </div>
      <div class="input-group">
        <label for="quote-price">Rate</label>
        <input type="number" id="quote-price" min="0" step="0.01" placeholder="0.00">
      </div>
    </div>
    <div class="button-row">
      <button id="btn-quote-add" class="btn">Add Item</button>
      <button id="btn-quote-sample" class="btn btn-secondary">Sample</button>
      <button id="btn-quote-clear-items" class="btn btn-secondary">Clear Items</button>
    </div>
  </section>

  <section class="tool-panel">
    <div class="settings-grid">
      <div class="input-group">
        <label for="quote-tax">Tax %</label>
        <input type="number" id="quote-tax" min="0" step="0.01" value="0">
      </div>
      <div class="input-group">
        <label for="quote-discount">Discount</label>
        <input type="number" id="quote-discount" min="0" step="0.01" value="0">
      </div>
      <div class="input-group">
        <label for="quote-deposit">Deposit %</label>
        <input type="number" id="quote-deposit" min="0" max="100" step="0.01" value="0">
      </div>
    </div>
    <div class="input-group">
      <label for="quote-notes">Terms / Notes</label>
      <textarea id="quote-notes" class="textarea-short" placeholder="Timeline, payment terms, exclusions, or next steps."></textarea>
    </div>

    <div class="metric-grid">
      <div class="metric"><span>Items</span><strong id="quote-count">0</strong></div>
      <div class="metric"><span>Estimate</span><strong id="quote-total">$0.00</strong></div>
      <div class="metric"><span>Deposit</span><strong id="quote-deposit-total">$0.00</strong></div>
    </div>

    <div id="quote-list" class="invoice-list"></div>

    <div class="button-row">
      <button id="btn-quote-pdf" class="btn">Download Estimate PDF</button>
      <button id="btn-quote-copy" class="btn btn-secondary">Copy Summary</button>
    </div>
  </section>
</div>
