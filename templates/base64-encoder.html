<div class="tool-header">
  <h2>Base64 Encoder / Decoder</h2>
  <p>Encode text to Base64 or decode Base64 back to text. Unicode and emoji supported.</p>
</div>

<div class="tool-dashboard">
  <section class="tool-panel">
    <div class="input-group">
      <label for="b64-input">Input</label>
      <textarea id="b64-input" placeholder="Type or paste text here…" spellcheck="false"></textarea>
    </div>
    <div class="button-row">
      <button id="btn-b64-encode" class="btn">Encode</button>
      <button id="btn-b64-decode" class="btn btn-secondary">Decode</button>
      <button id="btn-b64-clear" class="btn btn-secondary">Clear</button>
    </div>
  </section>
  <section class="tool-panel">
    <div class="input-group">
      <label for="b64-output">Output</label>
      <textarea id="b64-output" readonly placeholder="Result will appear here…" spellcheck="false"></textarea>
    </div>
    <button id="btn-b64-copy" class="btn">Copy Output</button>
  </section>
</div>
