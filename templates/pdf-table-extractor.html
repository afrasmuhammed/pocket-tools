<div class="tool-header">
  <h2>PDF Table Extractor</h2>
  <p>Pull table-like selectable text from a PDF and export it as CSV.</p>
</div>

<div class="tool-dashboard">
  <section class="tool-panel">
    <div class="drop-zone">
      <input type="file" id="pte-upload" accept="application/pdf">
      <div>
        <strong>Select PDF</strong>
        <span>Works best with selectable text PDFs, invoices, statements, and reports.</span>
      </div>
    </div>
    <div class="settings-grid">
      <div class="input-group">
        <label for="pte-mode">Column Detection</label>
        <select id="pte-mode">
          <option value="auto">Auto spacing</option>
          <option value="loose">Loose spacing</option>
          <option value="strict">Strict spacing</option>
        </select>
      </div>
      <div class="input-group">
        <label for="pte-min-cols">Minimum Columns</label>
        <input type="number" id="pte-min-cols" min="2" max="8" value="2">
      </div>
    </div>
    <div class="button-row">
      <button id="btn-pte-extract" class="btn" disabled>Extract Tables</button>
      <button id="btn-pte-clear" class="btn btn-secondary">Clear</button>
    </div>
  </section>

  <section class="tool-panel">
    <div class="metric-grid">
      <div class="metric"><span>Pages</span><strong id="pte-pages">0</strong></div>
      <div class="metric"><span>Rows</span><strong id="pte-rows">0</strong></div>
      <div class="metric"><span>Columns</span><strong id="pte-cols">0</strong></div>
    </div>
    <div class="input-group">
      <label for="pte-output">CSV Output</label>
      <textarea id="pte-output" class="textarea-tall" readonly placeholder="Extracted CSV will appear here..." spellcheck="false"></textarea>
      <span class="field-hint">Scanned PDFs need OCR first. This tool extracts text that already exists inside the PDF.</span>
    </div>
    <div id="pte-preview" class="seo-result-list"></div>
    <div class="button-row">
      <button id="btn-pte-copy" class="btn">Copy CSV</button>
      <button id="btn-pte-download" class="btn btn-secondary">Download CSV</button>
    </div>
  </section>
</div>
