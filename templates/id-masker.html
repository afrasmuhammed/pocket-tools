<div class="tool-header">
  <h2>ID Masker</h2>
  <p>Draw boxes over sensitive details — everything runs locally, nothing is uploaded.</p>
</div>

<div class="image-workbench">
  <section class="image-panel">
    <div class="drop-zone">
      <input type="file" id="im-upload" accept="image/*,.heic,.heif,image/heic,image/heif,application/pdf">
      <div>
        <strong>Select Image or PDF</strong>
        <span>Supports photos and PDFs. Draw boxes over any detail you want hidden.</span>
      </div>
    </div>
  </section>

  <section id="im-controls" class="image-panel hidden">
    <div class="settings-grid">
      <div class="input-group">
        <label>Mask Style</label>
        <select id="im-style">
          <option value="black">Black Box</option>
          <option value="blur">Blur Block</option>
        </select>
      </div>
      <div class="input-group">
        <label>PDF Page</label>
        <input type="number" id="im-page" min="1" value="1">
        <span class="field-hint">Only used when the file is a PDF.</span>
      </div>
    </div>
    <div class="button-row">
      <button id="im-undo" class="btn btn-secondary">↩ Undo</button>
      <button id="im-clear" class="btn btn-secondary">Clear All</button>
      <button id="im-download" class="btn">Download PNG</button>
    </div>
    <span class="field-hint" style="margin-top:10px;display:block">Drag on the preview below to place masks.</span>
  </section>

  <section id="im-preview" class="image-panel hidden">
    <div class="panel-title">
      <h3>Preview</h3>
    </div>
    <div class="mask-canvas-wrap">
      <canvas id="im-canvas"></canvas>
    </div>
  </section>
</div>
