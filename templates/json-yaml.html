<div class="tool-header">
  <h2>JSON to YAML Converter</h2>
  <p>Convert JSON objects and arrays into readable YAML.</p>
</div>

<div class="tool-dashboard">
  <section class="tool-panel">
    <div class="input-group">
      <label for="jyaml-input">Input JSON</label>
      <textarea id="jyaml-input" class="textarea-tall" placeholder='Paste JSON here... e.g. {"name":"PocketKit"}' spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off"></textarea>
    </div>

    <div class="button-row">
      <button id="btn-jyaml-convert" class="btn">Convert</button>
      <button id="btn-jyaml-sample" class="btn btn-secondary">Sample</button>
      <button id="btn-jyaml-clear" class="btn btn-secondary">Clear</button>
    </div>
  </section>

  <section class="tool-panel">
    <div class="input-group">
      <label for="jyaml-output">YAML Output</label>
      <textarea id="jyaml-output" class="textarea-tall" readonly placeholder="Converted YAML will appear here..." spellcheck="false"></textarea>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <span>Keys</span>
        <strong id="jyaml-keys">0</strong>
      </div>
      <div class="stat-card">
        <span>Lines</span>
        <strong id="jyaml-lines">0</strong>
      </div>
      <div class="stat-card">
        <span>Size</span>
        <strong id="jyaml-size">0</strong>
      </div>
    </div>

    <button id="btn-jyaml-copy" class="btn">Copy YAML</button>
  </section>
</div>
