<div class="tool-header">
  <h2>Client Email Polisher</h2>
  <p>Turn rough notes into a clear client-ready email without sending anything to a server.</p>
</div>

<div class="tool-dashboard">
  <section class="tool-panel">
    <div class="input-group">
      <label for="cep-input">Rough Draft</label>
      <textarea id="cep-input" class="textarea-tall" placeholder="Paste rough bullets, a half-written email, or the point you need to make..." spellcheck="true"></textarea>
    </div>
    <div class="settings-grid">
      <div class="input-group">
        <label for="cep-tone">Tone</label>
        <select id="cep-tone">
          <option value="friendly">Friendly professional</option>
          <option value="concise">Short and direct</option>
          <option value="firm">Firm but polite</option>
          <option value="follow-up">Follow-up</option>
          <option value="payment">Payment reminder</option>
        </select>
      </div>
      <div class="input-group">
        <label for="cep-name">Recipient</label>
        <input type="text" id="cep-name" placeholder="Optional name">
      </div>
      <div class="input-group">
        <label for="cep-ask">Ask / Next Step</label>
        <input type="text" id="cep-ask" placeholder="Approve, confirm, share feedback...">
      </div>
    </div>
    <div class="button-row">
      <button id="btn-cep-polish" class="btn">Polish Email</button>
      <button id="btn-cep-sample" class="btn btn-secondary">Sample</button>
      <button id="btn-cep-clear" class="btn btn-secondary">Clear</button>
    </div>
  </section>

  <section class="tool-panel">
    <div class="metric-grid">
      <div class="metric"><span>Words</span><strong id="cep-words">0</strong></div>
      <div class="metric"><span>Tone</span><strong id="cep-tone-metric">--</strong></div>
      <div class="metric"><span>Structure</span><strong id="cep-structure">--</strong></div>
    </div>
    <div class="input-group">
      <label for="cep-output">Polished Email</label>
      <textarea id="cep-output" class="textarea-tall" readonly placeholder="Your polished email will appear here..." spellcheck="false"></textarea>
    </div>
    <div class="button-row">
      <button id="btn-cep-copy" class="btn">Copy Email</button>
      <button id="btn-cep-download" class="btn btn-secondary">Download .txt</button>
    </div>
  </section>
</div>
