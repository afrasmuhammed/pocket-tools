<div class="tool-header">
  <h2>Keyword Density Checker</h2>
  <p>Analyze repeated words and phrases in page copy without sending text anywhere.</p>
</div>

<div class="tool-dashboard">
  <section class="tool-panel">
    <div class="input-group">
      <label for="kd-text">Content</label>
      <textarea id="kd-text" class="textarea-tall" placeholder="Paste article, landing page, or product copy..." spellcheck="false"></textarea>
    </div>
    <div class="settings-grid">
      <div class="input-group">
        <label for="kd-target">Target Keyword</label>
        <input id="kd-target" placeholder="pocket tools">
      </div>
      <div class="input-group">
        <label for="kd-phrase">Phrase Length</label>
        <select id="kd-phrase">
          <option value="1">Single words</option>
          <option value="2">Two-word phrases</option>
          <option value="3">Three-word phrases</option>
        </select>
      </div>
    </div>
    <div class="button-row">
      <button id="btn-kd-sample" class="btn btn-secondary">Sample</button>
      <button id="btn-kd-clear" class="btn btn-secondary">Clear</button>
    </div>
  </section>

  <section class="tool-panel">
    <div class="metric-grid">
      <div class="metric">
        <span>Words</span>
        <strong id="kd-word-count">0</strong>
      </div>
      <div class="metric">
        <span>Target Uses</span>
        <strong id="kd-target-count">0</strong>
      </div>
      <div class="metric">
        <span>Density</span>
        <strong id="kd-target-density">0%</strong>
      </div>
    </div>
    <div id="kd-results" class="seo-result-list"></div>
  </section>
</div>
