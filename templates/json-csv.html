<div class="tool-header">
  <h2>JSON to CSV Converter</h2>
  <p>Convert JSON arrays into spreadsheet-friendly CSV text.</p>
</div>

<div class="tool-dashboard">
  <section class="tool-panel">
    <div class="input-group">
      <label for="jcsv-input">Input JSON</label>
      <textarea id="jcsv-input" class="textarea-tall" placeholder='Paste JSON here... e.g. [{"name":"Afras","role":"Owner"}]' spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off"></textarea>
    </div>

    <div class="form-grid">
      <div class="input-group">
        <label for="jcsv-delimiter">Delimiter</label>
        <select id="jcsv-delimiter">
          <option value=",">Comma</option>
          <option value=";">Semicolon</option>
          <option value="tab">Tab</option>
        </select>
      </div>
      <div class="input-group">
        <label for="jcsv-headers">Headers</label>
        <select id="jcsv-headers">
          <option value="yes">Include header row</option>
          <option value="no">Data rows only</option>
        </select>
      </div>
    </div>

    <div class="button-row">
      <button id="btn-jcsv-convert" class="btn">Convert</button>
      <button id="btn-jcsv-sample" class="btn btn-secondary">Sample</button>
      <button id="btn-jcsv-clear" class="btn btn-secondary">Clear</button>
    </div>
  </section>

  <section class="tool-panel">
    <div class="input-group">
      <label for="jcsv-output">CSV Output</label>
      <textarea id="jcsv-output" class="textarea-tall" readonly placeholder="Converted CSV will appear here..." spellcheck="false"></textarea>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <span>Rows</span>
        <strong id="jcsv-rows">0</strong>
      </div>
      <div class="stat-card">
        <span>Columns</span>
        <strong id="jcsv-columns">0</strong>
      </div>
      <div class="stat-card">
        <span>Size</span>
        <strong id="jcsv-size">0</strong>
      </div>
    </div>

    <button id="btn-jcsv-copy" class="btn">Copy CSV</button>
  </section>
</div>
