<div class="tool-header">
  <h2>Reading Time Estimator</h2>
  <p>Find out how long it takes to read or speak your text.</p>
</div>

<div class="tool-dashboard">
  <section class="tool-panel">
    <div class="input-group">
      <label for="rt-input">Input Text</label>
      <textarea id="rt-input" class="textarea-tall" placeholder="Type or paste your text here..."></textarea>
    </div>
  </section>
  <section class="tool-panel">
    <div class="metric-grid">
      <div class="metric">
        <span>Words</span>
        <strong id="rt-words">0</strong>
      </div>
      <div class="metric">
        <span>Reading Time</span>
        <strong id="rt-time">0 min</strong>
      </div>
      <div class="metric">
        <span>Speaking Time</span>
        <strong id="rt-speak">0 min</strong>
      </div>
    </div>
    <span class="field-hint" style="margin-top:10px;display:block">Reading at 225 wpm · Speaking at 130 wpm</span>
  </section>
</div>
