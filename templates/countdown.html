<div class="tool-header">
  <h2>Countdown Timer</h2>
  <p>Count down to any date and time — meetings, deadlines, events.</p>
</div>

<div class="tool-dashboard">

  <section class="tool-panel">
    <div class="settings-grid">
      <div class="input-group">
        <label for="cd-label">Event Name <span style="color:var(--muted);font-weight:400">(optional)</span></label>
        <input type="text" id="cd-label" placeholder="e.g. Product Launch">
      </div>
      <div class="input-group">
        <label for="cd-target">Target Date &amp; Time</label>
        <input type="datetime-local" id="cd-target">
      </div>
    </div>
    <div class="button-row">
      <button class="btn" id="btn-cd-start">Start Countdown</button>
      <button class="btn btn-secondary" id="btn-cd-reset">Reset</button>
    </div>
  </section>

  <section class="tool-panel timer-panel" id="cd-display-panel" style="display:none">
    <p id="cd-event-name" class="timer-status" style="margin-bottom:8px"></p>
    <div class="cd-clock" id="cd-clock">
      <div class="cd-unit"><span id="cd-days">00</span><small>Days</small></div>
      <div class="cd-sep">:</div>
      <div class="cd-unit"><span id="cd-hours">00</span><small>Hours</small></div>
      <div class="cd-sep">:</div>
      <div class="cd-unit"><span id="cd-mins">00</span><small>Min</small></div>
      <div class="cd-sep">:</div>
      <div class="cd-unit"><span id="cd-secs">00</span><small>Sec</small></div>
    </div>
    <p id="cd-target-label" class="timer-status" style="margin-top:16px"></p>
  </section>

  <section class="tool-panel" id="cd-done-panel" style="display:none;text-align:center">
    <p style="font-size:48px;margin:0 0 8px">🎉</p>
    <p id="cd-done-msg" style="font-size:18px;font-weight:700;letter-spacing:-0.02em;margin:0 0 4px"></p>
    <p style="color:var(--muted);font-size:14px;margin:0">The countdown has ended.</p>
  </section>

</div>
