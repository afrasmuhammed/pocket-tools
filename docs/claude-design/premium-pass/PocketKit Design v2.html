<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>PocketKit v2 — premium pass</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="pocketkit.css" />
<link rel="stylesheet" href="pocketkit-v2.css" />
<style>
  html, body { margin: 0; height: 100%; }
  body { background: #f0eee9; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif; }
  #root { height: 100%; }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="atoms.jsx"></script>
<script type="text/babel" src="artboards-desktop.jsx"></script>
<script type="text/babel" src="artboards-mobile.jsx"></script>

<script type="text/babel" src="atoms-v2.jsx"></script>
<script type="text/babel" src="artboards-desktop-v2.jsx"></script>
<script type="text/babel" src="artboards-mobile-v2.jsx"></script>

<script type="text/babel" data-presets="env,react">
  const { DesignCanvas, DCSection, DCArtboard, DCPostIt } = window;

  // Theme wrapper for light variants
  const LightFrame = ({ children }) => (
    <div data-theme="light" className="pk2" style={{ height: '100%' }}>
      {children}
    </div>
  );

  const App = () => (
    <DesignCanvas>
      <DCSection id="v2-intro" title="PocketKit v2 — premium pass"
                 subtitle="Same calm app, raised fidelity. Dark by default, per-pocket accents, real depth.">
        <DCPostIt x={0} y={0} width={320}>
          <b>What changed from v1</b><br/><br/>
          • <b>Dark mode primary</b> — warm near-black, light mode mirrored<br/><br/>
          • <b>Per-pocket accent colors</b> — Daily sage, Developer blue, Designer violet, SEO olive, QA teal, Student amber, Shop ember. Used only on the pocket mark + a soft aura<br/><br/>
          • <b>Type-led hero</b> with Instrument Sans display + italic counterline; physical "pocket stack" visual as proof of metaphor<br/><br/>
          • <b>New pockets:</b> Designer (absorbs Image), Student (writing/study)<br/><br/>
          • <b>Real pricing block</b> with all-Pro early-access tier<br/><br/>
          • <b>Soft depth:</b> top-edge gleam inside cards + low-opacity shadow on elevated surfaces. No glow, no gradients in chrome.
        </DCPostIt>

        <DCPostIt x={340} y={0} width={280}>
          <b>Tokens (committed)</b><br/><br/>
          Type: Instrument Sans (display) + system sans (UI) + IBM Plex Mono (meta)<br/><br/>
          Radii: 6 / 10 / 14 / 18 / 22<br/><br/>
          Type scale: 56 / 36 / 30 / 24 / 17 / 14 / 13 / 12 / 11<br/><br/>
          Spacing: 18px (mobile), 56–64px (desktop)<br/><br/>
          Buttons: 30 / 38 / 46 px tall<br/><br/>
          Two badge variants only: Free (sage) · Pro (amber) — both pill, ~22px tall
        </DCPostIt>

        <DCPostIt x={640} y={0} width={280}>
          <b>Premium without noise</b><br/><br/>
          Things deliberately <i>not</i> done:<br/>
          • No gradients on chrome<br/>
          • No glow / no neon<br/>
          • No big illustrations<br/>
          • No "AI shimmer" anywhere<br/>
          • No 'Compare plans' table<br/>
          • No emoji<br/>
          • No oversized hero<br/><br/>
          Premium cues that <i>are</i> doing the work:<br/>
          • Instrument Sans display with italic counterline<br/>
          • Pocket stack visual (proves the metaphor)<br/>
          • Per-pocket aura<br/>
          • Top-edge gleam on cards (1px highlight inset)<br/>
          • Mono meta — feels like an app's inspector, not a marketing site
        </DCPostIt>
      </DCSection>

      <DCSection id="v2-desktop" title="Desktop · dark"
                 subtitle="1280-wide screens, dark mode default.">
        <DCArtboard id="v2-landing" label="01 · Landing (premium pass)" width={1280} height={2080}>
          <LandingV2 />
        </DCArtboard>

        <DCArtboard id="v2-pockets" label="02 · Pockets index" width={1280} height={920}>
          <PocketsIndex />
        </DCArtboard>

        <DCArtboard id="v2-daily" label="03 · Pocket · Daily (free)" width={1280} height={1080}>
          <PocketDailyV2 />
        </DCArtboard>

        <DCArtboard id="v2-designer" label="04 · Pocket · Designer (Pro preview)" width={1280} height={1120}>
          <PocketDesignerPro />
        </DCArtboard>

        <DCArtboard id="v2-all" label="05 · All tools" width={1280} height={1340}>
          <AllToolsV2 />
        </DCArtboard>

        <DCArtboard id="v2-tool" label="06 · Tool page · Color Palette Extractor" width={1280} height={1020}>
          <ToolPageV2 />
        </DCArtboard>
      </DCSection>

      <DCSection id="v2-light" title="Light mode pair"
                 subtitle="Same surfaces, light theme. Both modes are first-class.">
        <DCArtboard id="v2-light-landing" label="07 · Landing (light)" width={1280} height={2080}>
          <LightFrame><LandingV2 /></LightFrame>
        </DCArtboard>
        <DCArtboard id="v2-light-designer" label="08 · Designer Pro (light)" width={1280} height={1120}>
          <LightFrame><PocketDesignerPro /></LightFrame>
        </DCArtboard>
      </DCSection>

      <DCSection id="v2-mobile" title="Mobile · dark"
                 subtitle="390-wide. Bottom nav, denser type, thumb-friendly targets.">
        <DCArtboard id="v2-m-landing" label="09 · Mobile · Landing" width={390} height={900}>
          <MLandingV2 />
        </DCArtboard>
        <DCArtboard id="v2-m-pocket" label="10 · Mobile · Designer Pro" width={390} height={900}>
          <MPocketProV2 />
        </DCArtboard>
        <DCArtboard id="v2-m-tool" label="11 · Mobile · Tool · QR" width={390} height={900}>
          <MToolPageV2 />
        </DCArtboard>
      </DCSection>

      <DCSection id="v1" title="v1 reference — original pass"
                 subtitle="Kept for comparison. Same product, lighter visual treatment.">
        <DCArtboard id="v1-landing" label="v1 · Landing" width={1280} height={1620}>
          <Landing />
        </DCArtboard>
        <DCArtboard id="v1-daily" label="v1 · Daily" width={1280} height={1100}>
          <PocketDaily />
        </DCArtboard>
        <DCArtboard id="v1-tool" label="v1 · Tool page" width={1280} height={820}>
          <ToolPage />
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
